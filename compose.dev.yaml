# cspell:words healthcheck
# The historical Compose service name 'mcp' is kept for image-only rollback.
# This container now runs ONE Go kgosd process for Web, API and MCP.
name: kgos-dev

services:
  mcp:
    image: kgos-dev-mcp:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.unified
      args:
        NODE_IMAGE: ${KGOS_DEV_NODE_IMAGE:-node:24.15.0-bookworm-slim}
        DEBIAN_IMAGE: ${KGOS_DEV_DEBIAN_IMAGE:-docker.y2l.top/debian:bookworm-slim}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    restart: unless-stopped
    # The existing persistent Dev Workspace and administrator secret belong
    # to UID 1000. Keep their ownership unchanged during the image migration.
    # The distributed image itself still defaults to non-root UID 10001.
    user: "1000:1000"
    environment:
      KGOS_ROOT: /workspace
      KGOS_MCP_HOST: 0.0.0.0
      KGOS_MCP_PORT: "3777"
      KGOS_MCP_OAUTH_ISSUER: ${KGOS_DEV_OAUTH_ISSUER:-https://kgos-dev.y2l.top}
      # Old Node MCP env is temporarily retained for safe image-only rollback.
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: 127.0.0.1,localhost
    ports:
      - "0.0.0.0:${KGOS_DEV_PORT:-3777}:3777"
    volumes:
      - type: bind
        source: /data/apps/KgosDev/data/workspace
        target: /workspace
    healthcheck:
      test:
        - CMD
        - /usr/bin/timeout
        - "4"
        - /usr/bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/3777
          printf 'GET /mcp HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS=' ' read -r protocol status rest <&3
          test "$$status" = 401
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 20s
