name: CI

# Public main is generated by the private source sync. No PR receives source access.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: source-ci-${{ github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'bYiyLi/kg-releases' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.actor == 'bYiyLi')
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      revision: ${{ steps.manifest.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate generated source metadata
        id: manifest
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('source.json','utf8'));
          if(m.schema!==1||m.repository!=='bYiyLi/kg-os'||!/^[0-9a-f]{40}$/.test(m.revision)||(m.ref!=='refs/heads/main'&&!/^refs\/tags\/v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(m.ref)))throw Error('SOURCE_MANIFEST_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`revision=${m.revision}\nref=${m.ref}\n`);
          NODE
      - uses: actions/checkout@v7
        with:
          repository: bYiyLi/kg-os
          ref: ${{ steps.manifest.outputs.revision }}
          ssh-key: ${{ secrets.KGOS_SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version
      - name: Verify source ancestry and select necessary checks
        id: scope
        env:
          SOURCE_REF: ${{ steps.manifest.outputs.ref }}
          SOURCE_SHA: ${{ steps.manifest.outputs.revision }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source merge-base --is-ancestor HEAD refs/remotes/origin/main
          if [[ "$SOURCE_REF" == refs/tags/* ]]; then
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "::error::CANDIDATE_MAIN_MANIFEST_REQUIRED"
              exit 1
            fi
            test "$(git -C source rev-parse "$SOURCE_REF^{commit}")" = "$SOURCE_SHA"
            echo 'scope=tag' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SCOPE=full
          if [ "$EVENT" = push ] && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            BASE=$(git show "$BEFORE:source.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{try{const m=JSON.parse(s);if(/^[0-9a-f]{40}$/.test(m.revision))process.stdout.write(m.revision)}catch{}})') || BASE=
            if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git -C source merge-base --is-ancestor "$BASE" HEAD; then
              SCOPE=$(node scripts/release-candidate.mjs scope source "$BASE")
            fi
          fi
          printf 'scope=%s\n' "$SCOPE" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate private source
    outputs:
      tools: ${{ steps.toolchain.outputs.receipt }}
    needs: prepare
    if: needs.prepare.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out generated public metadata
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate public source manifest
        id: manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('source.json', 'utf8'));
          if (data.schema !== 1 || data.repository !== 'bYiyLi/kg-os' ||
              !/^[0-9a-f]{40}$/.test(data.revision) ||
              (data.ref !== 'refs/heads/main' && !/^refs\/tags\/v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(data.ref))) {
            throw Error('Invalid generated source manifest');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${data.revision}\nref=${data.ref}\n`);
          NODE

      - name: Check out private source
        uses: actions/checkout@v7
        with:
          repository: bYiyLi/kg-os
          ref: ${{ steps.manifest.outputs.revision }}
          ssh-key: ${{ secrets.KGOS_SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Verify commit is on source main
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.manifest.outputs.revision }}
          SOURCE_REF: ${{ steps.manifest.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if [[ "$SOURCE_REF" == refs/tags/* ]]; then
            test "$(git rev-parse "$SOURCE_REF^{commit}")" = "$SOURCE_SHA"
          fi
          echo "Accepted source SHA: $SOURCE_SHA"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version

      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache: false

      - name: Install Rust and CGO dependencies
        id: toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(rustc --version | cut -d' ' -f2)" = "1.97.1"
          sudo apt-get update
          sudo apt-get install -y gcc
          test "$(go env GOVERSION)" = "go1.27.3"
          printf 'receipt={"node":"%s","pnpm":"%s","go":"%s","rust":"%s"}\n' "$(node --version | sed 's/^v//')" "$(pnpm --version)" "$(go env GOVERSION | sed 's/^go//')" "$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and Chromium
        working-directory: source
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify official Plugin and single installer source
        working-directory: source
        run: |
          set -euo pipefail
          if node --test tests/render-kg-releases.node-test.mjs tests/release-candidate.node-test.mjs > "$RUNNER_TEMP/kgos-distribution-tests.log" 2>&1; then
            echo "Official Plugin distribution and single installer validated"
          else
            echo "::error::Distribution export checks failed; details are suppressed on public runners"
            exit 1
          fi

      - name: Validate without publishing source-derived logs
        working-directory: source
        run: |
          set -euo pipefail
          set +e
          GITHUB_STEP_SUMMARY="$RUNNER_TEMP/kgos-private-summary.md" pnpm validate > "$RUNNER_TEMP/kgos-validate.log" 2>&1
          STATUS=$?
          set -e
          node ../scripts/ci-report.mjs "$RUNNER_TEMP/kgos-validate.log" "$STATUS" | tee "$RUNNER_TEMP/kgos-safe-report.json"
          cat "$RUNNER_TEMP/kgos-safe-report.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

  docker-unified:
    name: Build and seal tested Linux amd64 candidate
    needs: [prepare, validate]
    if: needs.prepare.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out generated public metadata
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate public source manifest
        id: manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('source.json', 'utf8'));
          if (data.schema !== 1 || data.repository !== 'bYiyLi/kg-os' ||
              !/^[0-9a-f]{40}$/.test(data.revision) ||
              (data.ref !== 'refs/heads/main' && !/^refs\/tags\/v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(data.ref))) {
            throw Error('Invalid generated source manifest');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${data.revision}\nref=${data.ref}\n`);
          NODE

      - name: Check out private source
        uses: actions/checkout@v7
        with:
          repository: bYiyLi/kg-os
          ref: ${{ steps.manifest.outputs.revision }}
          ssh-key: ${{ secrets.KGOS_SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Verify commit is on source main
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.manifest.outputs.revision }}
          SOURCE_REF: ${{ steps.manifest.outputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if [[ "$SOURCE_REF" == refs/tags/* ]]; then
            test "$(git rev-parse "$SOURCE_REF^{commit}")" = "$SOURCE_SHA"
          fi
          echo "Accepted source SHA: $SOURCE_SHA"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version

      - name: Install test-client dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install OCI transport
        run: |
          set -euo pipefail
          if ! (sudo apt-get update && sudo apt-get install -y skopeo) > "$RUNNER_TEMP/kgos-oci-install.log" 2>&1; then
            echo "::error::OCI_TRANSPORT_SETUP_FAILED"
            exit 1
          fi
      - name: Build once, reload OCI, smoke, and seal candidate
        env:
          KGOS_VALIDATION_TOOLS: ${{ needs.validate.outputs.tools }}
        run: |
          set -euo pipefail
          if ! node scripts/release-candidate.mjs build . source "$RUNNER_TEMP/candidate" > "$RUNNER_TEMP/kgos-candidate.log" 2>&1; then
            node scripts/ci-report.mjs "$RUNNER_TEMP/kgos-candidate.log" 1 | tee "$RUNNER_TEMP/kgos-safe-candidate-report.json"
            cat "$RUNNER_TEMP/kgos-safe-candidate-report.json" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CANDIDATE_BUILD_OR_SMOKE_FAILED"
            exit 1
          fi
      - name: Upload accepted binary candidate only when distribution is approved
        id: candidate
        if: vars.KGOS_BINARY_DISTRIBUTION_APPROVED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kgos-candidate-${{ needs.prepare.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Download sealed artifact to verify real handoff
        if: vars.KGOS_BINARY_DISTRIBUTION_APPROVED == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate-roundtrip
          merge-multiple: true
          digest-mismatch: error
      - name: Verify downloaded bytes and OCI identities
        if: vars.KGOS_BINARY_DISTRIBUTION_APPROVED == 'true'
        run: node scripts/release-candidate.mjs check-files "$RUNNER_TEMP/candidate-roundtrip"

  website:
    name: Check website archive without rebuilding the product
    needs: prepare
    if: needs.prepare.outputs.scope == 'website'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: bYiyLi/kg-os
          ref: ${{ needs.prepare.outputs.revision }}
          ssh-key: ${{ secrets.KGOS_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version
      - name: Validate distribution and source website
        run: |
          set -euo pipefail
          if ! (cd source && node --test tests/render-kg-releases.node-test.mjs && cd distribution/site && pnpm install --frozen-lockfile && pnpm check && pnpm build) > "$RUNNER_TEMP/kgos-site-source.log" 2>&1; then
            echo "::error::SOURCE_WEBSITE_CHECK_FAILED"
            exit 1
          fi
      - name: Check generated public website
        working-directory: site
        run: pnpm install --frozen-lockfile && pnpm check && pnpm build
