name: Product website

# Public, static content only. This workflow never checks out private KG OS
# source and has no access to KGOS_SOURCE_DEPLOY_KEY.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: product-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro website
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public distribution
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Typecheck and generate static site
        working-directory: site
        run: pnpm check && pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
