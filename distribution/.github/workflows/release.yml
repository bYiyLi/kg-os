name: Release
# Promote an accepted immutable candidate. No build or full test suite runs here.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: kgos-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'bYiyLi/kg-releases' && vars.KGOS_BINARY_DISTRIBUTION_APPROVED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Check out generated public source manifest
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify source manifest matches the public tag
        id: manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('source.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (data.schema !== 1 || data.repository !== 'bYiyLi/kg-os' ||
              !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) ||
              data.ref !== `refs/tags/${tag}` || !/^[0-9a-f]{40}$/.test(data.revision)) {
            throw Error('Public tag does not match a trusted private source tag');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${data.revision}\n`);
          NODE

      - name: Check out exact private source tag
        uses: actions/checkout@v7
        with:
          repository: bYiyLi/kg-os
          ref: ${{ steps.manifest.outputs.revision }}
          ssh-key: ${{ secrets.KGOS_SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Verify tag, package version, and private main ancestry
        id: source
        working-directory: source
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ steps.manifest.outputs.revision }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          test "$TAG" = "v$VERSION"
          git show-ref --verify --quiet "refs/tags/$TAG"
          REVISION=$(git rev-parse HEAD)
          test "$REVISION" = "$EXPECTED_SOURCE_SHA"
          test "$REVISION" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
          printf 'image=ghcr.io/byiyli/kgos:%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version
      - name: Install OCI transport
        run: |
          set -euo pipefail
          if ! (sudo apt-get update && sudo apt-get install -y skopeo) > "$RUNNER_TEMP/kgos-oci-install.log" 2>&1; then
            echo "::error::OCI_TRANSPORT_SETUP_FAILED"
            exit 1
          fi
      - name: Find an accepted candidate or verify completed release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-delivery.mjs find . source "$RUNNER_TEMP/release" >> "$GITHUB_OUTPUT"
      - name: Download the exact immutable candidate artifact
        if: steps.candidate.outputs.complete != 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: bYiyLi/kg-releases
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Authenticate existing release identity to GHCR
        if: steps.candidate.outputs.complete != 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/kgos-registry-auth.json
        run: printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Verify and promote exact candidate, then complete release assets
        if: steps.candidate.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/kgos-registry-auth.json
        run: node scripts/release-delivery.mjs promote . source "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/release/run.json"
