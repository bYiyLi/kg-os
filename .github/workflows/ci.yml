name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version: 1.27.1

      - name: Install Rust for official Jieba
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(rustc --version | cut -d' ' -f2)" = "1.97.1"

      - name: Install CGO toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
          go version
          cc --version
          test "$(go env GOVERSION)" = "go1.27.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Validate KG OS
        run: pnpm validate

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: validation-reports
          path: |
            coverage
            playwright-report
            test-results
          retention-days: 7

  native-runtime:
    name: Native Runtime / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-11-vs2026-arm
            target: win32-arm64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version: 1.27.1

      - name: Install Rust for official Jieba
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(rustc --version | cut -d' ' -f2)" = "1.97.1"

      - name: Install Linux CGO toolchain
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Verify native target
        run: |
          go version
          if [[ "${{ matrix.target }}" == win32-* ]]; then gcc --version; else cc --version; fi
          test "$(go env GOVERSION)" = "go1.27.1"
          test "$(node -p "process.platform + '-' + process.arch")" = "${{ matrix.target }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current Runtime package
        run: pnpm build

      - name: Run native Lithograph suite
        run: pnpm test:native

      - name: Pack and smoke-test npm candidates
        run: pnpm pack:release

      - name: Upload npm candidates
        uses: actions/upload-artifact@v7
        with:
          name: npm-candidates-${{ matrix.target }}
          path: artifacts/release/*.tgz
          if-no-files-found: error
          retention-days: 7
