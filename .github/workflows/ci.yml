name: CI

# Docker-only: validate source and test the actual linux/amd64 runtime image.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version: 1.27.2

      - name: Install Rust for official Jieba
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(rustc --version | cut -d' ' -f2)" = "1.97.1"

      - name: Install CGO toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
          go version
          cc --version
          test "$(go env GOVERSION)" = "go1.27.2"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Validate KG OS
        run: pnpm validate

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: validation-reports
          path: |
            coverage
            playwright-report
            test-results
          retention-days: 7

  docker-unified:
    name: Unified Docker / Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install test client dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Go-only Linux amd64 Docker image
        env:
          IMAGE: kgos-unified-ci:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -f Dockerfile.unified -t "$IMAGE" .

      - name: Run real unified Docker integration smoke
        env:
          KGOS_UNIFIED_DOCKER_SMOKE_IMAGE: kgos-unified-ci:${{ github.sha }}
        run: node scripts/mcp-unified-docker-smoke.mjs
