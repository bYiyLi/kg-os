name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* release tag to recover
        required: true
        type: string
      reuse_release_run:
        description: Completed Release run ID whose verified release-set artifact must be reused
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_DIST_TAG: latest

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      revision: ${{ steps.baseline.outputs.revision }}
      tag: ${{ steps.release-tag.outputs.tag }}
      version: ${{ steps.baseline.outputs.version }}

    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          RELEASE_TAG="${PUSH_TAG:-$DISPATCH_TAG}"
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release-tag.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version: 1.27.1

      - name: Install Rust for official Jieba
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(rustc --version | cut -d' ' -f2)" = "1.97.1"

      - name: Install CGO toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify release baseline
        id: baseline
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          git fetch origin main --tags
          node scripts/release.mjs preflight \
            --dist-tag "$RELEASE_DIST_TAG" \
            --release-tag "$RELEASE_TAG"
          VERSION=$(node -p 'require("./package.json").version')
          REVISION=$(git rev-parse HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Validate release revision
        run: pnpm validate

  candidate:
    name: Release candidate / ${{ matrix.target }}
    needs: preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_release_run == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-11-vs2026-arm
            target: win32-arm64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version: 1.27.1

      - name: Install Rust for official Jieba
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(rustc --version | cut -d' ' -f2)" = "1.97.1"

      - name: Install Windows arm64 CGO toolchain
        if: matrix.target == 'win32-arm64'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          release: false
          update: true
          install: mingw-w64-clang-aarch64-clang

      - name: Select Windows arm64 CGO compiler
        if: matrix.target == 'win32-arm64'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $compiler = Join-Path $env:MSYS2_ROOT 'clangarm64\bin\clang.exe'
          if (!(Test-Path $compiler)) { throw "Windows arm64 compiler is missing" }
          $target = & $compiler -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target -ne 'aarch64-w64-windows-gnu') { throw "Windows arm64 compiler target is $target" }
          "CC=$compiler" >> $env:GITHUB_ENV

      - name: Install Linux CGO toolchain
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native runner target
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == win32-arm64 ]]; then test "$("$CC" -dumpmachine)" = "aarch64-w64-windows-gnu"; fi

      - name: Build Runtime candidate
        run: pnpm build

      - name: Run native Lithograph suite
        run: pnpm test:native

      - name: Remove non-package build metadata
        run: rm -f packages/sdk/dist/.tsbuildinfo packages/cli/dist/.tsbuildinfo

      - name: Pack and smoke-test candidate
        run: node scripts/pack-release.mjs --output artifacts/release

      - name: Upload immutable candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ matrix.target }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Aggregate release candidates
    needs:
      - preflight
      - candidate
    if: ${{ always() && needs.preflight.result == 'success' && (needs.candidate.result == 'success' || inputs.reuse_release_run != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.preflight.outputs.revision }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Download platform candidates
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_release_run == '' }}
        uses: actions/download-artifact@v7
        with:
          pattern: release-candidate-*
          path: artifacts/candidates

      - name: Aggregate exact release set
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_release_run == '' }}
        run: |
          node scripts/release.mjs aggregate \
            --input artifacts/candidates \
            --output artifacts/final \
            --revision "${{ needs.preflight.outputs.revision }}" \
            --version "${{ needs.preflight.outputs.version }}"

      - name: Download verified release set for partial recovery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_release_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_release_run }}
        run: |
          [[ "$REUSE_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "Recovery run ID must be numeric" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" \
            --jq '[.name == "Release", .path == ".github/workflows/release.yml", .status == "completed"] | all' \
            | grep -Fx true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" \
            --jq '.head_repository.full_name' | grep -Fx "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "Aggregate release candidates" and .conclusion == "success")] | length' \
            | grep -Fx 1
          gh run download "$REUSE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name release-set \
            --dir artifacts/final
          node scripts/release.mjs verify-release-set \
            --directory artifacts/final \
            --revision "${{ needs.preflight.outputs.revision }}" \
            --version "${{ needs.preflight.outputs.version }}"

      - name: Upload release set
        uses: actions/upload-artifact@v7
        with:
          name: release-set
          path: artifacts/final
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact npm versions
    needs:
      - preflight
      - aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.preflight.outputs.revision }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Download release set
        uses: actions/download-artifact@v7
        with:
          name: release-set
          path: artifacts/final

      - name: Dry-run registry release state
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/release.mjs publish \
            --directory artifacts/final \
            --dist-tag "$RELEASE_DIST_TAG" \
            --dry-run

      - name: Publish or recover matching partial release
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/release.mjs publish \
            --directory artifacts/final \
            --dist-tag "$RELEASE_DIST_TAG"

      - name: Verify exact registry package set
        run: |
          node scripts/release.mjs verify-registry \
            --directory artifacts/final \
            --dist-tag "$RELEASE_DIST_TAG"

  registry-smoke:
    name: Registry smoke / ${{ matrix.target }}
    needs:
      - preflight
      - publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-11-vs2026-arm
            target: win32-arm64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out registry smoke tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Run clean public-registry npx smoke
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
          node scripts/release-registry-smoke.mjs --version "${{ needs.preflight.outputs.version }}"

  finalize:
    name: Create GitHub Release
    needs:
      - preflight
      - aggregate
      - registry-smoke
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.preflight.outputs.revision }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Download release set
        uses: actions/download-artifact@v7
        with:
          name: release-set
          path: artifacts/final

      - name: Reverify registry release state
        run: |
          node scripts/release.mjs verify-registry \
            --directory artifacts/final \
            --dist-tag "$RELEASE_DIST_TAG"

      - name: Verify pushed release tag
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          REVISION: ${{ needs.preflight.outputs.revision }}
        run: |
          git fetch --tags origin
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$REVISION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          KG OS $VERSION

          Public npm packages:
          - @kgos/sdk@$VERSION
          - @kgos/cli@$VERSION
          - @kgos/runtime-darwin-arm64@$VERSION
          - @kgos/runtime-darwin-x64@$VERSION
          - @kgos/runtime-linux-arm64@$VERSION
          - @kgos/runtime-linux-x64@$VERSION
          - @kgos/runtime-win32-arm64@$VERSION
          - @kgos/runtime-win32-x64@$VERSION

          Supported native targets: macOS, Linux glibc, and Windows arm64/x64.
          EOF
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "KG OS $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Verify GitHub Release revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          REVISION: ${{ needs.preflight.outputs.revision }}
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$REVISION"
          gh release view "$RELEASE_TAG" --json tagName --jq '.tagName' | grep -Fx "$RELEASE_TAG"
