name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* release tag to recover
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_DIST_TAG: latest

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      revision: ${{ steps.baseline.outputs.revision }}
      tag: ${{ steps.release-tag.outputs.tag }}
      version: ${{ steps.baseline.outputs.version }}

    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          RELEASE_TAG="${PUSH_TAG:-$DISPATCH_TAG}"
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release-tag.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version: 1.27.1

      - name: Install CGO toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Verify release baseline
        id: baseline
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          git fetch origin main --tags
          node scripts/release.mjs preflight \
            --dist-tag "$RELEASE_DIST_TAG" \
            --release-tag "$RELEASE_TAG"
          VERSION=$(node -p 'require("./package.json").version')
          REVISION=$(git rev-parse HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Validate release revision
        run: pnpm validate

  candidate:
    name: Release candidate / ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35

    steps:
      - name: Check out release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version: 1.27.1

      - name: Install Linux CGO toolchain
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native runner target
        run: test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"

      - name: Build Runtime candidate
        run: pnpm build

      - name: Run native Lithograph suite
        run: pnpm test:native

      - name: Remove non-package build metadata
        run: rm -f packages/sdk/dist/.tsbuildinfo packages/cli/dist/.tsbuildinfo

      - name: Pack and smoke-test candidate
        run: node scripts/pack-release.mjs --output artifacts/release

      - name: Upload immutable candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ matrix.target }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Aggregate release candidates
    needs:
      - preflight
      - candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Download platform candidates
        uses: actions/download-artifact@v7
        with:
          pattern: release-candidate-*
          path: artifacts/candidates

      - name: Aggregate exact release set
        run: |
          node scripts/release.mjs aggregate \
            --input artifacts/candidates \
            --output artifacts/final \
            --revision "${{ needs.preflight.outputs.revision }}" \
            --version "${{ needs.preflight.outputs.version }}"

      - name: Upload release set
        uses: actions/upload-artifact@v7
        with:
          name: release-set
          path: artifacts/final
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact npm versions
    needs:
      - preflight
      - aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Download release set
        uses: actions/download-artifact@v7
        with:
          name: release-set
          path: artifacts/final

      - name: Dry-run registry release state
        run: |
          node scripts/release.mjs publish \
            --directory artifacts/final \
            --dist-tag "$RELEASE_DIST_TAG" \
            --dry-run

      - name: Publish or recover matching partial release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/release.mjs publish \
            --directory artifacts/final \
            --dist-tag "$RELEASE_DIST_TAG"

      - name: Verify exact registry package set
        run: |
          node scripts/release.mjs verify-registry \
            --directory artifacts/final \
            --dist-tag "$RELEASE_DIST_TAG"

  registry-smoke:
    name: Registry smoke / ${{ matrix.target }}
    needs:
      - preflight
      - publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Check out registry smoke tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Run clean public-registry npx smoke
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
          node scripts/release-registry-smoke.mjs --version "${{ needs.preflight.outputs.version }}"

  finalize:
    name: Create GitHub Release
    needs:
      - preflight
      - aggregate
      - registry-smoke
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Download release set
        uses: actions/download-artifact@v7
        with:
          name: release-set
          path: artifacts/final

      - name: Reverify registry release state
        run: |
          node scripts/release.mjs verify-registry \
            --directory artifacts/final \
            --dist-tag "$RELEASE_DIST_TAG"

      - name: Verify pushed release tag
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          REVISION: ${{ needs.preflight.outputs.revision }}
        run: |
          git fetch --tags origin
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$REVISION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          KG OS $VERSION

          Public npm packages:
          - @kgos/sdk@$VERSION
          - @kgos/cli@$VERSION
          - @kgos/runtime-darwin-arm64@$VERSION
          - @kgos/runtime-darwin-x64@$VERSION
          - @kgos/runtime-linux-arm64@$VERSION
          - @kgos/runtime-linux-x64@$VERSION

          Supported native targets: macOS arm64/x64 and Linux glibc arm64/x64.
          EOF
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "KG OS $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Verify GitHub Release revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          REVISION: ${{ needs.preflight.outputs.revision }}
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$REVISION"
          gh release view "$RELEASE_TAG" --json tagName --jq '.tagName' | grep -Fx "$RELEASE_TAG"
