name: Release

# Only the tested Linux amd64 Docker image is published. Legacy npm releases
# and multi-platform Runtime candidates are intentionally no longer produced.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Publish Linux amd64 Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out existing release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify exact tag and main ancestry
        id: release
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          test "$TAG" = "v$VERSION"
          git show-ref --verify --quiet "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/kgos:$TAG" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install test client dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build exact Linux amd64 image from tag
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          docker build --platform linux/amd64 -f Dockerfile.unified \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$TAG" \
            -t "$IMAGE" .

      - name: Smoke-test the exact image before publishing
        env:
          KGOS_UNIFIED_DOCKER_SMOKE_IMAGE: ${{ steps.release.outputs.image }}
        run: node scripts/mcp-unified-docker-smoke.mjs

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push tested image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: docker push "$IMAGE"

      - name: Verify image platform, revision, and registry digest
        id: verify
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/amd64"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$REVISION"
          DIGEST_REF=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE")
          case "$DIGEST_REF" in
            ghcr.io/*@sha256:*) ;;
            *) echo "Missing GHCR digest for exact image" >&2; exit 1 ;;
          esac
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      - name: Create or confirm GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST_REF: ${{ steps.verify.outputs.digest_ref }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $TAG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "KG OS $TAG" \
              --notes "Linux amd64 Docker: $IMAGE

          Verified image digest: $DIGEST_REF"
          fi
